[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squirrel-campus"
version = "1.0.0"
description = "A whimsical, function-calling driven text RPG where you play as an ambitious campus squirrel surviving a semester."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "art3messs" }
]
keywords = ["squirrel", "cli-game", "ai-agent", "function-calling", "rpg", "text-adventure"]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
squirrel-campus = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
